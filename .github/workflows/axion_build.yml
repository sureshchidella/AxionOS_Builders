name: Configurable ROM Builder
run-name: '${{ inputs.ROM_SOURCE }} / ${{ inputs.DEVICE }} (${{ inputs.RELEASETYPE }}) | User: ${{ inputs.BUILD_USER }} (${{ inputs.BUILD_USER_ID }})'

on:
  workflow_dispatch:
    inputs:
      ROM_SOURCE:
        description: 'Source key from config/sources.json (e.g., lineage)'
        required: true
        default: 'lineage'
      DEVICE:
        description: 'Device Codename (e.g., walleye)'
        required: true
        default: 'walleye'
      EXTRA_BUILD_FLAGS:
        description: 'Optional safe build arguments, e.g. -j32 (appended at {build_flags})'
        required: false
        default: ''
      GENERATE_KEYS:
        description: 'Generate missing signing keys using the source signing recipe?'
        required: true
        default: 'No'
        type: choice
        options:
          - 'No'
          - 'Yes'
      RELEASETYPE:
        description: 'Build Release Type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - user
          - userdebug
          - eng
      FULLCLEAN:
        description: 'Run make clean (Wipe out)?'
        required: true
        default: 'No'
        type: choice
        options:
          - 'No'
          - 'Yes'
      GMS_VARIANT:
        description: 'Source build variant (available as {variant} in the configured build command)'
        required: true
        default: 'GMS'
        type: choice
        options:
          - 'GMS'
          - 'PICO'
          - 'CORE'
          - 'VANILLA'
      UPLOAD_CDN:
        description: 'Upload to the configured R2 CDN?'
        required: true
        default: 'No'
        type: choice
        options:
          - 'No'
          - 'Yes'
      BUILD_USER:
        description: 'Triggered By (Username)'
        required: true
        default: 'GitHub-Action'
      BUILD_USER_ID:
        description: 'Triggered By (ID)'
        required: true
        default: '0'
      CHAT_ID:
        description: 'Telegram Chat ID for notifications'
        required: false
        default: ''
      TOPIC_ID:
        description: 'Telegram Topic ID (for Forums)'
        required: false
        default: ''

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 360

    env:

      DEVICE: ${{ inputs.DEVICE }}
      ROM_SOURCE: ${{ inputs.ROM_SOURCE }}
      EXTRA_BUILD_FLAGS: ${{ inputs.EXTRA_BUILD_FLAGS }}
      GENERATE_KEYS: ${{ inputs.GENERATE_KEYS }}
      RELEASETYPE: ${{ inputs.RELEASETYPE }}
      FULLCLEAN: ${{ inputs.FULLCLEAN }}
      UPLOAD_CDN: ${{ inputs.UPLOAD_CDN }}
      GMS_VARIANT: ${{ inputs.GMS_VARIANT }}
      BUILD_USER: ${{ inputs.BUILD_USER }}
      BUILD_USER_ID: ${{ inputs.BUILD_USER_ID }}

      # Secrets are injected by GitHub only for this job. They are never read
      # through the GitHub API and must not be printed by workflow steps.
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ (inputs.CHAT_ID != '' && inputs.CHAT_ID != 'none' && inputs.CHAT_ID) || secrets.TELEGRAM_CHAT_ID }}
      TOPIC_BUILDER: ${{ (inputs.TOPIC_ID != '' && inputs.TOPIC_ID != 'none' && inputs.TOPIC_ID) || secrets.TOPIC_BUILDER }}
      TOPIC_ERROR_LOGS: ${{ secrets.TOPIC_ERROR_LOGS || 'none' }}
      TOPIC_RELEASE_JSON: ${{ secrets.TOPIC_RELEASE_JSON || 'none' }}

      # Aliases let workflow-run tools use the same names as the local bot
      # configuration where applicable.
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHANNEL_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # R2 Credentials
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_CDN_DOMAIN: ${{ secrets.R2_CDN_DOMAIN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      PD_API_KEY: ${{ secrets.PD_API_KEY }}

      # A GH_PAT is needed only when the job must write repository contents.
      # Otherwise the built-in, short-lived token is used.
      GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
      GITHUB_REPO_NAME: ${{ github.repository }}
      GIT_CONFIG_GLOBAL: ${{ github.workspace }}/.gitconfig_temp

    steps:
      - name: Runner Info
        run: |
          echo "Node version: $(node -v || echo 'Not installed')"
          echo "Git version: $(git --version || echo 'Not installed')"
          echo "Current user: $(whoami)"
          echo "Workspace: ${{ github.workspace }}"

      - name: Checkout Repo (Scripts)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Environment
        run: |
          echo "AOSP_SOURCE_DIR=$HOME/android/source" >> $GITHUB_ENV

      - name: Resolve ROM and device configuration
        run: |
          python3 builder/resolve_config.py \
            --source "$ROM_SOURCE" \
            --device "$DEVICE" \
            --build-type "$RELEASETYPE" \
            --variant "$GMS_VARIANT" \
            --extra-build-flags "$EXTRA_BUILD_FLAGS" \
            --github-env "$GITHUB_ENV"

      - name: Prepare Scripts
        run: |
          chmod +x builder/*.sh
          chmod +x builder/*.py

          rm -f *.log progress.txt .build_msg_id
          rm -f $AOSP_SOURCE_DIR/out/error.log

          mkdir -p $AOSP_SOURCE_DIR

      - name: Notify Start
        run: |
          python3 builder/reporter.py \
            --run-id "${{ github.run_id }}" \
            --status started \
            --device "$DEVICE" \
            --build-type "$RELEASETYPE" \
            --release-status "No" \
            --gms "$GMS_VARIANT" \
            --full-clean "$FULLCLEAN" \
            --upload-cdn "$UPLOAD_CDN" \
            --user "$BUILD_USER" \
            --chat-id "$TELEGRAM_CHAT_ID" \
            --topic-builder "$TOPIC_BUILDER" \
            --topic-error-logs "$TOPIC_ERROR_LOGS" \
            --topic-release-json "$TOPIC_RELEASE_JSON" \
            --token "$TELEGRAM_TOKEN" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-dir "$AOSP_SOURCE_DIR"

      - name: Sync Source
        run: |
          python3 builder/reporter.py \
            --run-id "${{ github.run_id }}" \
            --status syncing \
            --device "$DEVICE" \
            --build-type "$RELEASETYPE" \
            --release-status "No" \
            --gms "$GMS_VARIANT" \
            --full-clean "$FULLCLEAN" \
            --upload-cdn "$UPLOAD_CDN" \
            --user "$BUILD_USER" \
            --chat-id "$TELEGRAM_CHAT_ID" \
            --topic-builder "$TOPIC_BUILDER" \
            --topic-error-logs "$TOPIC_ERROR_LOGS" \
            --topic-release-json "$TOPIC_RELEASE_JSON" \
            --token "$TELEGRAM_TOKEN" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-dir "$AOSP_SOURCE_DIR"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SYNC_CMD="cd $AOSP_SOURCE_DIR && ${{ github.workspace }}/builder/sync.sh \"$LOCAL_MANIFEST_URL\""

          ${{ github.workspace }}/builder/tmux_runner.sh \
            "axion_build" \
            "$SYNC_CMD" \
            "${{ github.workspace }}/sync.log"

      - name: Generate signing keys
        if: inputs.GENERATE_KEYS == 'Yes'
        run: |
          python3 builder/generate_keys.py \
            --source "$ROM_SOURCE" \
            --source-dir "$AOSP_SOURCE_DIR"

      - name: Build ROM
        id: build_rom
        run: |
          python3 builder/reporter.py \
            --run-id "${{ github.run_id }}" \
            --status monitoring \
            --device "$DEVICE" \
            --build-type "$RELEASETYPE" \
            --release-status "No" \
            --gms "$GMS_VARIANT" \
            --full-clean "$FULLCLEAN" \
            --upload-cdn "$UPLOAD_CDN" \
            --user "$BUILD_USER" \
            --chat-id "$TELEGRAM_CHAT_ID" \
            --topic-builder "$TOPIC_BUILDER" \
            --topic-error-logs "$TOPIC_ERROR_LOGS" \
            --topic-release-json "$TOPIC_RELEASE_JSON" \
            --token "$TELEGRAM_TOKEN" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-dir "$AOSP_SOURCE_DIR" &
          MONITOR_PID=$!

          BUILD_CMD="cd $AOSP_SOURCE_DIR && ${{ github.workspace }}/builder/build.sh \"$DEVICE\" \"$FULLCLEAN\""

          if ${{ github.workspace }}/builder/tmux_runner.sh \
            "axion_build" \
            "$BUILD_CMD" \
            "${{ github.workspace }}/build.log" \
            "${{ github.workspace }}/progress.txt"; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          kill $MONITOR_PID || true

      - name: Notify Success
        if: steps.build_rom.outputs.BUILD_SUCCESS == 'true'
        run: |
          python3 builder/reporter.py \
            --run-id "${{ github.run_id }}" \
            --status success \
            --device "$DEVICE" \
            --build-type "$RELEASETYPE" \
            --release-status "No" \
            --gms "$GMS_VARIANT" \
            --full-clean "$FULLCLEAN" \
            --upload-cdn "$UPLOAD_CDN" \
            --user "$BUILD_USER" \
            --chat-id "$TELEGRAM_CHAT_ID" \
            --topic-builder "$TOPIC_BUILDER" \
            --topic-error-logs "$TOPIC_ERROR_LOGS" \
            --topic-release-json "$TOPIC_RELEASE_JSON" \
            --token "$TELEGRAM_TOKEN" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-dir "$AOSP_SOURCE_DIR"

      - name: Notify Failure
        if: failure()
        run: |
          python3 builder/reporter.py \
            --run-id "${{ github.run_id }}" \
            --status failure \
            --device "$DEVICE" \
            --build-type "$RELEASETYPE" \
            --release-status "No" \
            --gms "$GMS_VARIANT" \
            --full-clean "$FULLCLEAN" \
            --upload-cdn "$UPLOAD_CDN" \
            --user "$BUILD_USER" \
            --chat-id "$TELEGRAM_CHAT_ID" \
            --topic-builder "$TOPIC_BUILDER" \
            --topic-error-logs "$TOPIC_ERROR_LOGS" \
            --topic-release-json "$TOPIC_RELEASE_JSON" \
            --token "$TELEGRAM_TOKEN" \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --source-dir "$AOSP_SOURCE_DIR"

      - name: Force Kill Processes
        if: cancelled()
        run: |
          echo "Workflow cancelled. Ensuring processes are dead..."
          tmux send-keys -t axion_build C-c 2>/dev/null || true
          pkill -f "reporter.py --status monitoring" || true

      - name: Notify Cancelled
        if: cancelled()
        run: |
            python3 builder/reporter.py \
              --run-id "${{ github.run_id }}" \
              --status aborted \
              --device "$DEVICE" \
              --build-type "$RELEASETYPE" \
              --release-status "No" \
              --gms "$GMS_VARIANT" \
              --full-clean "$FULLCLEAN" \
              --user "$BUILD_USER" \
              --chat-id "$TELEGRAM_CHAT_ID" \
              --topic-builder "$TOPIC_BUILDER" \
              --topic-error-logs "$TOPIC_ERROR_LOGS" \
              --topic-release-json "$TOPIC_RELEASE_JSON" \
              --token "$TELEGRAM_TOKEN" \
              --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --source-dir "$AOSP_SOURCE_DIR"
